<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    h2 { font-size: 16px; margin: 0 0 8px 0; color: #3b82f6; }
    p { font-size: 12px; color: #94a3b8; margin-bottom: 12px; }
    button {
      width: 100%;
      padding: 10px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    #result {
      margin-top: 12px;
      padding: 10px;
      background: #1e293b;
      border-radius: 8px;
      font-size: 11px;
      display: none;
    }
    .verdict-fake { color: #f43f5e; font-weight: bold; }
    .verdict-real { color: #10b981; font-weight: bold; }
  </style>
</head>
<body>
  <h2>VeritasAI Extension</h2>
  <p>Verify current active webpage article in real-time.</p>
  <button id="verifyBtn">Verify Page Content</button>
  <div id="result"></div>
  <script src="popup.js"></script>
</body>
</html>
